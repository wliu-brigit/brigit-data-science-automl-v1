[project]
name = "brigit-automl"
version = "0.1.0"
description = "AutoML agent skill for tabular ML problems — Claude Code skill bundle"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
automl = "automl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["automl*", "projects*"]
exclude = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "ruff>=0.5",
    "pyyaml>=6.0",
    "google-cloud-storage>=3.10.1",
    "snowflake-connector-python[pandas]>=3.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "joblib>=1.3",
    "cloudpickle>=3.0",
    "mlflow==3.3.1",
    "shap>=0.46",
    "tabulate>=0.9",
    "numba>=0.61",
    "ipykernel>=7.2.0",
]
fraud = [
    "duckdb>=1.5.3",
    "igraph>=1.0.0",
]
neobank_ncm = [
    "torch>=2.12.0",
]

[tool.pytest.ini_options]
# projects/*/tests: project-owned tests live inside their project folder,
# not in the core tests/ tree, but still run with a bare `pytest`.
testpaths = ["tests/unit", "tests/contracts", "tests/integration", "tests/e2e", "projects/*/tests"]
pythonpath = ["."]
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated tests for pure functions and small classes",
    "integration: local integration, subprocess, file-backed MLflow, or multi-module tests",
    "contract: repository structure, docs, plugin, and runtime contract checks",
    "qa: opt-in tests for configured external services such as MLflow, GCS, Snowflake, or Claude",
    "e2e: opt-in committed project smoke checks using test-owned fixtures",
    "slow: long-running tests excluded from default pytest",
]

[tool.ruff]
line-length = 100
target-version = "py311"
